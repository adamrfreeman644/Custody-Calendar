<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Custody Calendar</title>
<style>
:root{--dad:#f28c28;--mum:#8b5cf6;--school:#facc15;--bg:#f6f7f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d9dee7;--shadow:0 18px 50px rgba(0,0,0,.16)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{width:100%;max-width:none;margin:0;padding:14px}.topbar{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.title h1{font-size:1.55rem;margin:.15rem 0 0}.month-control{display:flex;align-items:center;gap:8px}.month-control button{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card)}.month-control input{height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:0 11px;min-width:158px}.filebar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filebar button{min-height:42px;border-radius:11px;border:1px solid var(--border);background:var(--card);padding:0 13px;font-weight:700}.filebar .primary{background:#222;color:#fff;border-color:#222}.summary{margin:14px 0 10px}.summary-head{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:.95rem}.mum-text{color:var(--mum)}.dad-text{color:var(--dad)}.progress{height:24px;border-radius:999px;overflow:hidden;border:1px solid var(--border);display:flex;background:var(--card);margin-top:7px}.progress>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:800}.mumbar{background:var(--mum)}.dadbar{background:var(--dad)}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{padding:4px 9px;border-radius:999px;font-size:.72rem;font-weight:800}.pill.mum{background:#efe8ff;border:1px solid var(--mum)}.pill.dad{background:#fff0df;border:1px solid var(--dad)}.pill.school{background:#fff6b6;border:1px solid var(--school)}.pill.neg{background:#f3f4f6;border:1px dashed #777}.calendar-shell{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--card)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{text-align:center;padding:10px 4px;font-weight:800;color:var(--muted);border-bottom:1px solid var(--border)}.day{min-height:128px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden}.day.empty{background:#fafafa}.daynum{font-weight:800;font-size:.9rem}.slots{display:grid;gap:4px;margin-top:5px}.slot{width:100%;text-align:left;border-radius:7px;padding:5px 6px;font-size:.72rem;font-weight:800;line-height:1.15;border:0}.slot.mum{background:#efe8ff;border-left:4px solid var(--mum)}.slot.dad{background:#fff0df;border-left:4px solid var(--dad)}.slot.mumneg{background:#f5f0ff;border:1px dashed var(--mum);border-left:4px solid var(--mum)}.slot.dadneg{background:#fff6eb;border:1px dashed var(--dad);border-left:4px solid var(--dad)}.school{border-radius:7px;padding:5px 6px;font-size:.72rem;font-weight:800;text-align:center;background:#fff2a0;border-left:4px solid var(--school)}.note{margin-top:5px;font-size:.62rem;line-height:1.2;color:var(--muted)}.status{margin:8px 2px 0;color:var(--muted);font-size:.78rem;min-height:1.1em}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:50}.backdrop.open{display:flex}.popup{width:min(430px,100%);background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:15px}.popup h2{font-size:1rem;margin:0}.popup .sub{font-size:.8rem;color:var(--muted);margin:3px 0 12px}.choices{display:grid;gap:8px}.choice{min-height:48px;border-radius:12px;padding:10px 12px;text-align:left;font-weight:850;border:1px solid var(--border);background:#fff}.choice.mum{border-color:var(--mum);background:#efe8ff}.choice.mumneg{border:2px dashed var(--mum);background:#f5f0ff}.choice.dadneg{border:2px dashed var(--dad);background:#fff6eb}.choice.dad{border-color:var(--dad);background:#fff0df}.cancel{width:100%;min-height:44px;margin-top:10px;border:1px solid var(--border);border-radius:12px;background:#fff}
@media(max-width:720px){.app{padding:7px}.title h1{font-size:1.2rem}.topbar{align-items:center}.month-control{width:100%;display:grid;grid-template-columns:44px 1fr 44px}.month-control input{width:100%;min-width:0}.filebar{display:grid;grid-template-columns:1fr 1fr}.weekday{font-size:.65rem;padding:7px 1px}.day{min-height:99px;padding:3px}.daynum{font-size:.72rem}.slot,.school{font-size:.53rem;padding:4px 3px;border-radius:5px}.note{font-size:.48rem}.summary-head{font-size:.82rem}}
@media(max-width:430px){.weekday .long{display:none}.weekday .short{display:inline}.day{min-height:94px}}@media(min-width:431px){.weekday .short{display:none}}


.utility-menu{position:absolute;top:14px;right:14px;z-index:20}
.menu-button{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:1.15rem;font-weight:900}
.menu-panel{display:none;position:absolute;right:0;top:49px;width:190px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.menu-panel.open{display:grid;gap:5px}
.menu-panel button{min-height:40px;border:1px solid var(--border);border-radius:9px;background:var(--card);padding:7px 9px;text-align:left;font-weight:750}
/* Portrait phones: true two-week calendar, all 14 days visible with no scrolling. */
@media (orientation:portrait) and (max-width:720px){
  html,body{height:100%;overflow:hidden}
  .app{height:100dvh;display:flex;flex-direction:column;padding:5px;overflow:hidden}
  .topbar{flex:0 0 auto;display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center}
  .title>div{display:none}.title h1{font-size:.72rem;line-height:1;margin:0;font-weight:850;white-space:nowrap}
  .month-control{width:auto;display:grid;grid-template-columns:30px 30px 30px;gap:3px;padding-right:34px}
  .month-control button{width:30px;height:30px;border-radius:7px;padding:0}
  .month-control input{display:none}
  .legend,.status{display:none}
  .utility-menu{top:5px;right:5px}.menu-button{width:30px;height:30px;border-radius:7px;font-size:.8rem}.menu-panel{top:34px;width:170px}
  .summary{flex:0 0 auto;margin:4px 0}
  .summary-head{font-size:.61rem}.progress{height:8px;margin-top:1px}.progress>div{font-size:0}
  .calendar-shell{flex:0 0 auto;min-height:0;border-radius:9px;display:flex;flex-direction:column;overflow:hidden}
  .calendar-shell>.calendar:first-child{flex:0 0 20px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .weekday{padding:3px 0;font-size:.5rem;line-height:1;border-bottom:1px solid var(--border)}
  .weekday .long{display:none}.weekday .short{display:inline}
  #grid{flex:0 0 auto;min-height:0;height:auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(2,132px)}
  .day{min-height:0;height:auto;padding:2px;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .daynum{font-size:.5rem;line-height:1.05;min-height:18px;text-align:left;display:flex;align-items:center;justify-content:flex-start;font-weight:850}
  .slots{flex:1 1 auto;min-height:0;margin:1px 0 0;display:grid;grid-template-rows:1fr 14px 1fr;gap:2px}
  .slot{min-width:0;min-height:0;width:100%;height:100%;padding:1px;border-radius:4px;font-size:0;display:flex;align-items:center;justify-content:center;text-align:center;border-left-width:3px!important}
  .slot::before{font-size:.48rem;line-height:1;font-weight:900}
  .slot[data-period="am"]::before{content:"AM"}
  .slot[data-period="pm"]::before{content:"PM"}
  .school{position:static;width:auto;height:14px;padding:1px 0;border:0;border-radius:3px;font-size:.42rem;line-height:12px;font-weight:850;text-align:center;background:#fff2a0;color:#5b4a00}
  .slots:not(:has(.school))::before{content:"";grid-row:2;height:14px}
  .slots:not(:has(.school)) .slot[data-period="am"]{grid-row:1}
  .slots:not(:has(.school)) .slot[data-period="pm"]{grid-row:3}
  .day{position:relative}
  .note{display:none}
  .backdrop{padding:8px}.popup{padding:11px;border-radius:14px}.choice{min-height:42px}.cancel{min-height:40px}
}

.fortnight{margin-top:8px}.period-label{font-size:.72rem;font-weight:850;color:var(--muted);margin:0 2px 3px}
@media (orientation:portrait) and (max-width:720px){
  .fortnight{margin-top:3px;flex:0 0 auto}
  #fortnight2{margin-top:9px}
  .period-label{font-size:.5rem;margin:0 1px 1px}
  .fortnight .summary{margin:1px 0 2px}
  .fortnight .calendar-shell{flex:none}
  .fortnight #grid,.fortnight #grid2{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(2,82px);height:auto}
  .fortnight .daynum{min-height:14px;font-size:.43rem}
  .fortnight .school{height:11px;line-height:9px;font-size:.36rem}
  .fortnight .slots{grid-template-rows:1fr 11px 1fr}
  .fortnight .slots:not(:has(.school))::before{height:11px}
  .fortnight .slot::before{font-size:.43rem}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title"><div style="font-size:.78rem;color:var(--muted)">Custody calendar</div><h1 id="monthTitle"></h1></div>
    <div class="month-control"><button id="prevMonth">‹</button><input id="periodPicker" type="date"><button id="nextMonth">›</button></div>
  </div>
  <div class="utility-menu">
    <button id="menuButton" class="menu-button" aria-label="More options" aria-expanded="false">☰</button>
    <div id="menuPanel" class="menu-panel">
      <button id="saveFile">Save schedule CSV</button>
      <button id="loadFile">Load CSV</button>
      <button id="backupDb">Backup database</button>
    </div>
    <input id="fileInput" type="file" accept=".csv,text/csv" hidden>
  </div>
  <div class="fortnight" id="fortnight1">
    <div class="period-label" id="periodLabel1"></div>
    <div class="summary"><div class="summary-head"><span class="mum-text">Mum <span id="mumPct"></span></span><span class="dad-text">Dad <span id="dadPct"></span></span></div><div class="progress"><div id="mumBar" class="mumbar"></div><div id="dadBar" class="dadbar"></div></div></div>
    <div class="calendar-shell"><div class="calendar weekday-row">
    <div class="weekday"><span class="long">Monday</span><span class="short">M</span></div><div class="weekday"><span class="long">Tuesday</span><span class="short">T</span></div><div class="weekday"><span class="long">Wednesday</span><span class="short">W</span></div><div class="weekday"><span class="long">Thursday</span><span class="short">T</span></div><div class="weekday"><span class="long">Friday</span><span class="short">F</span></div><div class="weekday"><span class="long">Saturday</span><span class="short">S</span></div><div class="weekday"><span class="long">Sunday</span><span class="short">S</span></div>
  </div><div id="grid" class="calendar"></div></div>
  </div>
  <div class="fortnight" id="fortnight2">
    <div class="period-label" id="periodLabel2"></div>
    <div class="summary"><div class="summary-head"><span class="mum-text">Mum <span id="mumPct2"></span></span><span class="dad-text">Dad <span id="dadPct2"></span></span></div><div class="progress"><div id="mumBar2" class="mumbar"></div><div id="dadBar2" class="dadbar"></div></div></div>
    <div class="calendar-shell"><div class="calendar weekday-row">
    <div class="weekday"><span class="long">Monday</span><span class="short">M</span></div><div class="weekday"><span class="long">Tuesday</span><span class="short">T</span></div><div class="weekday"><span class="long">Wednesday</span><span class="short">W</span></div><div class="weekday"><span class="long">Thursday</span><span class="short">T</span></div><div class="weekday"><span class="long">Friday</span><span class="short">F</span></div><div class="weekday"><span class="long">Saturday</span><span class="short">S</span></div><div class="weekday"><span class="long">Sunday</span><span class="short">S</span></div>
  </div><div id="grid2" class="calendar"></div></div>
  </div>
  <div class="legend"><span class="pill mum">Mum</span><span class="pill dad">Dad</span><span class="pill school">School</span><span class="pill neg">Dashed = negotiable</span></div>
  <div id="status" class="status"></div>
</div>
<div id="backdrop" class="backdrop"><div class="popup"><h2 id="popupTitle"></h2><div id="popupSub" class="sub"></div><div class="choices"><button class="choice mum" data-value="mum">Mum</button><button class="choice mumneg" data-value="mum-neg">Mum — negotiable</button><button class="choice dadneg" data-value="dad-neg">Dad — negotiable</button><button class="choice dad" data-value="dad">Dad</button></div><button id="cancelPopup" class="cancel">Cancel</button></div></div>
<script>
const MS_DAY=86400000,MS_WEEK=7*MS_DAY,dadWeekendAnchor=new Date(Date.UTC(2026,8,12));
let overrides={},activeEdit=null;
const $=id=>document.getElementById(id),grid=$("grid"),status=$("status");
function isoDate(dt){return dt.toISOString().slice(0,10)}
function parseDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function mondayOf(dt){const x=new Date(dt),dow=x.getUTCDay();x.setUTCDate(x.getUTCDate()-((dow+6)%7));return x}
let periodStart=mondayOf(new Date());
function key(date,p){return date+"-"+p}
function weekendType(y,m,d){const dt=new Date(Date.UTC(y,m,d)),dow=dt.getUTCDay(),sat=new Date(dt);if(dow===0)sat.setUTCDate(dt.getUTCDate()-1);else sat.setUTCDate(dt.getUTCDate()+((6-dow+7)%7));const weeks=Math.round((sat-dadWeekendAnchor)/MS_WEEK);return ((weeks%2)+2)%2===0?"dad":"mum"}
function defaultState(y,m,d){const dt=new Date(Date.UTC(y,m,d)),dow=dt.getUTCDay(),wt=weekendType(y,m,d);let am="mum",pm="mum",note="";if(dow===1){am=pm="dad";const prev=new Date(Date.UTC(y,m,d-1));if(weekendType(prev.getUTCFullYear(),prev.getUTCMonth(),prev.getUTCDate())==="mum"){am="dad-neg";note="Dad pickup: Sunday night OR Monday morning"}}else if(dow===2){am=pm="dad"}else if(dow===3){am="dad";pm="mum";note="Dad school drop-off · Mum school pickup"}else if(dow===4){am=pm="mum"}else if(dow===5){am="mum";if(wt==="dad"){pm="dad-neg";note="Dad pickup: Friday night OR Saturday morning"}else pm="mum"}else if(dow===6){if(wt==="dad"){am="dad-neg";pm="dad";note="Dad pickup window continues from Friday night"}else am=pm="mum"}else if(dow===0){if(wt==="dad")am=pm="dad";else{am="mum";pm="dad-neg";note="Dad pickup: Sunday night OR Monday morning"}}return{am,pm,note,school:dow>=1&&dow<=5}}
function state(dt){const y=dt.getUTCFullYear(),m=dt.getUTCMonth(),d=dt.getUTCDate(),date=isoDate(dt),cutoff="2026-03-01",b=date<cutoff?{am:"",pm:"",note:"",school:false}:defaultState(y,m,d);if(overrides[key(date,"am")])b.am=overrides[key(date,"am")];if(overrides[key(date,"pm")])b.pm=overrides[key(date,"pm")];return b}
const parent=v=>!v?"":v.startsWith("mum")?"mum":"dad",label=v=>!v?"—":v==="mum"?"Mum":v==="mum-neg"?"Mum · Negotiable":v==="dad-neg"?"Dad · Negotiable":"Dad",cls=v=>!v?"blank":v==="mum"?"mum":v==="dad"?"dad":v==="mum-neg"?"mumneg":"dadneg";
async function loadOverrides(){const r=await fetch("/api/overrides"),rows=await r.json();overrides={};for(const x of rows)overrides[key(x.date,x.period)]=x.value;render()}
function renderFortnight(start,gridEl,pctM,pctD,barM,barD,labelEl){
 const end=new Date(start);end.setUTCDate(end.getUTCDate()+13);
 const shortFmt={day:"numeric",month:"short",year:"numeric",timeZone:"UTC"};
 $(labelEl).textContent=start.toLocaleDateString("en-GB",shortFmt)+" – "+end.toLocaleDateString("en-GB",shortFmt);
 gridEl.innerHTML="";let mum=0,dad=0;
 for(let i=0;i<14;i++){const dt=new Date(start);dt.setUTCDate(dt.getUTCDate()+i);const s=state(dt);mum+=(parent(s.am)==="mum")+(parent(s.pm)==="mum");dad+=(parent(s.am)==="dad")+(parent(s.pm)==="dad");const d=document.createElement("div");d.className="day";d.innerHTML=`<div class="daynum">${dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})}</div><div class="slots"><button class="slot ${cls(s.am)}" data-period="am" data-date="${isoDate(dt)}">AM · ${label(s.am)}</button>${s.school?'<div class="school">School</div>':""}<button class="slot ${cls(s.pm)}" data-period="pm" data-date="${isoDate(dt)}">PM · ${label(s.pm)}</button></div>${s.note?'<div class="note">'+s.note+'</div>':""}`;gridEl.appendChild(d)}
 const total=mum+dad,mp=total?mum/total*100:0,dp=total?dad/total*100:0;$(pctM).textContent=total?mp.toFixed(1)+"%":"—";$(pctD).textContent=total?dp.toFixed(1)+"%":"—";$(barM).style.width=mp+"%";$(barD).style.width=dp+"%";
 gridEl.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{activeEdit={date:b.dataset.date,period:b.dataset.period};const dt=parseDate(b.dataset.date);$("popupTitle").textContent=b.dataset.period.toUpperCase()+" custody";$("popupSub").textContent=dt.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});$("backdrop").classList.add("open")})
}
function render(){
 const overallEnd=new Date(periodStart);overallEnd.setUTCDate(overallEnd.getUTCDate()+27);
 const fmt={day:"numeric",month:"short",year:"numeric",timeZone:"UTC"};
 $("monthTitle").textContent=periodStart.toLocaleDateString("en-GB",fmt)+" – "+overallEnd.toLocaleDateString("en-GB",fmt);
 $("periodPicker").value=isoDate(periodStart);
 renderFortnight(periodStart,$("grid"),"mumPct","dadPct","mumBar","dadBar","periodLabel1");
 const second=new Date(periodStart);second.setUTCDate(second.getUTCDate()+14);
 renderFortnight(second,$("grid2"),"mumPct2","dadPct2","mumBar2","dadBar2","periodLabel2");
}
document.querySelectorAll(".choice").forEach(b=>b.onclick=async()=>{if(!activeEdit)return;const r=await fetch("/api/override",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({...activeEdit,value:b.dataset.value})});if(r.ok){$("backdrop").classList.remove("open");status.textContent="Change saved to Byte-Me.";await loadOverrides()}else status.textContent="Save failed."});
$("cancelPopup").onclick=()=>$("backdrop").classList.remove("open");$("backdrop").onclick=e=>{if(e.target===$("backdrop"))$("backdrop").classList.remove("open")};
$("prevMonth").onclick=()=>{periodStart.setUTCDate(periodStart.getUTCDate()-28);render()};$("nextMonth").onclick=()=>{periodStart.setUTCDate(periodStart.getUTCDate()+28);render()};$("periodPicker").onchange=()=>{if(!$("periodPicker").value)return;periodStart=mondayOf(parseDate($("periodPicker").value));render()};
$("saveFile").onclick=()=>{const end=new Date(periodStart);end.setUTCDate(end.getUTCDate()+27);const rows=[["date","am","pm"]];for(let i=0;i<28;i++){const dt=new Date(periodStart);dt.setUTCDate(dt.getUTCDate()+i);const s=state(dt);rows.push([isoDate(dt),s.am,s.pm])}const csv=rows.map(r=>r.join(",")).join("\n"),blob=new Blob([csv],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`custody-schedule-${isoDate(periodStart)}-to-${isoDate(end)}.csv`;a.click();URL.revokeObjectURL(a.href)};
$("backupDb").onclick=()=>location.href="/api/backup";
$("loadFile").onclick=()=>$("fileInput").click();
$("fileInput").onchange=async()=>{const f=$("fileInput").files[0];if(!f)return;const fd=new FormData();fd.append("file",f);const r=await fetch("/api/import",{method:"POST",body:fd}),j=await r.json();status.textContent=r.ok?`Imported ${j.imported} values.`:(j.error||"Import failed");await loadOverrides();$("fileInput").value=""};
$("menuButton").onclick=e=>{e.stopPropagation();const p=$("menuPanel"),open=p.classList.toggle("open");$("menuButton").setAttribute("aria-expanded",open)};
$("menuPanel").onclick=e=>e.stopPropagation();
document.addEventListener("click",()=>{$("menuPanel").classList.remove("open");$("menuButton").setAttribute("aria-expanded","false")});
loadOverrides();
</script>
</body></html>
